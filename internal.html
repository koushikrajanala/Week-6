
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Style Sheet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: white;
        }

        #heading {
            color: rgb(210, 30, 165);
            text-align: center;
            margin: 10px 0 20px;
        }

        .text {
            color: red;
            font-size: 25px;
            text-align: center;
            margin: 15px 0;
        }

        .important {
            color: brown;
            display: block;
            text-align: left;
            margin: 15px 0;
        }

        ul {
            color: black;
            text-align: left;
            padding-left: 30px;
            margin: 15px 0;
        }
    </style>
</head>

<body>

    <h1 id="heading">Web Programming</h1>

    <p class="text">
        CSS is used in HTML for design and coloring in web development.
    </p>

    <i class="important">
        Continously acquire knowledge
    </i>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <a href="./index.html">Back to index</a>

</body>
</html>
